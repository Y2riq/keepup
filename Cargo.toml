[package]
name = "keepup"
version = "0.2.0"
edition = "2021"
description = "Ultra-lightweight, single-binary uptime monitoring & public status page engine powered by Rust"
license = "MIT"
repository = "https://github.com/RidloGhifary/keepup"
homepage = "https://github.com/RidloGhifary/keepup"

[dependencies]
# Async Runtime & Web Framework
tokio = { version = "1.38", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7" }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "set-header"] }
tower = { version = "0.5", features = ["util"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "migrate"] }
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# TLS & Certificates
tokio-rustls = "0.26"
webpki-roots = "0.26"
rustls-pki-types = "1.0"
x509-parser = "0.16"

# HTTP Client & Webhooks
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Embedded Assets
rust-embed = { version = "8.4", features = ["axum"] }

# Serialization & Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }
dotenvy = "0.15"

# Authentication & Security
argon2 = "0.5"
jsonwebtoken = "9.3"
axum-extra = { version = "0.9", features = ["cookie"] }
subtle = "2.6"
time = "0.3"
tower_governor = "0.4"
governor = "0.6"
sha2 = "0.10"
hex = "0.4"

# DNS & Ping Probes
hickory-resolver = "0.26"
surge-ping = "0.9"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
